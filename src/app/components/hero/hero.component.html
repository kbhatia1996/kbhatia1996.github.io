<section class="hero" #heroSection>
  <div class="scroll-progress" #progressBar></div>

  <div class="hero__inner">
    <!-- Left: Text content -->
    <div class="hero__content" [class.visible]="contentVisible()">
      <p class="section-label">Portfolio</p>

      <h1 class="hero__title">
        <span class="hero__title-line">Karan</span>
        <span class="hero__title-line italic">Bhatia<span class="hero__title-dot">.</span></span>
      </h1>

      <p class="hero__subtitle">
        Senior Software Engineer with 7+ years of experience building reliable backend and cloud applications. I enjoy
        learning new tools, solving complex problems, and exploring practical uses for AI.
      </p>

      <div class="hero__cta">
        <a href="#work" class="btn-primary">
          <span>View Work</span>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M3 8H13M13 8L9 4M13 8L9 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
        </a>
        <a href="#contact" class="btn-ghost">Let's Talk</a>
      </div>

      <div class="hero__stats">
        <div class="stat">
          <span class="stat__number">7+</span>
          <span class="stat__label">Years Exp.</span>
        </div>
        <div class="stat__divider"></div>
        <div class="stat">
          <span class="stat__number">3</span>
          <span class="stat__label">Industries</span>
        </div>
      </div>
    </div>

    <!-- Right: silhouette-to-colour reveal, driven by CSS variables set on scroll -->
    <div class="hero__image-container">
      <div class="hero__image-reveal" #tilt>
        <div class="layer layer--silhouette">
          <img src="assets/images/portrait.jpg" alt="" aria-hidden="true" width="900" height="1350" decoding="async" />
        </div>

        <div class="layer layer--colour">
          <img src="assets/images/portrait.jpg" alt="Karan Bhatia" width="900" height="1350" decoding="async" fetchpriority="high" />
        </div>

        <div class="scan" aria-hidden="true"></div>
      </div>

      <!-- Decorative elements -->
      <div class="hero__image-decor">
        <div class="decor-ring"></div>
        <div class="decor-dots"></div>
      </div>
    </div>
  </div>

  <!-- Scroll hint -->
  <div class="scroll-hint" [class.hidden]="hintHidden()">
    <div class="scroll-hint__line"></div>
    <span>Scroll</span>
  </div>
</section>
